<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f11">
<title>Mi Caja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0d0f11;--s1:#15181b;--s2:#1b1f23;--bd:#262b30;--tx:#dde1e4;--mu:#8a929a;--ac:#4aa883;--ac2:#2f7d60;--rd:#d27474;--am:#d4a85f;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:0 14px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 0 10px}
.top h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.top small{color:var(--mu);display:block;font-size:12px;font-weight:400;margin-top:1px}
.ib{background:var(--s1);border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px;color:var(--mu)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{padding:18px 16px}
.lbl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 6px;letter-spacing:-.5px}
.pos{color:var(--ac)}.neg{color:var(--rd)}.warn{color:var(--am)}.mu{color:var(--mu)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.mini{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;min-width:0}
.mini b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);margin:20px 2px 8px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}.row .l b{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l span{color:var(--mu);font-size:12.5px}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.row.click{cursor:pointer}
.alert{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px;border:1px solid}
.alert.r{background:#2a1a1a;border-color:#4a2a2a;color:#e0a0a0}.alert.a{background:#2a2418;border-color:#4a3e24;color:#dcc08a}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,15,17,.96);border-top:1px solid var(--bd);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:11px 4px 12px;color:var(--mu);cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button i{font-style:normal;font-size:18px}
.nav button.on{color:var(--ac)}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ac2);border:1px solid var(--ac);color:#eafaf3;font-size:30px;line-height:1;cursor:pointer;z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.seg{display:flex;background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:8px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 0 0 1px var(--bd)}
.bar{height:6px;background:var(--s2);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac2);border-radius:6px}
.bar.rd i{background:#9b4f4f}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);margin-right:6px}
.tag.g{color:var(--ac);border-color:#2b5a47}.tag.r{color:var(--rd);border-color:#5a3333}.tag.a{color:var(--am);border-color:#5a4a2a}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:550}
.btn.p{background:var(--ac2);border-color:var(--ac);color:#eafaf3}
.btn.d{color:var(--rd)}
.btn.sm{padding:6px 11px;font-size:13px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mnav b{text-transform:capitalize}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.sh{background:var(--s1);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:93vh;display:flex;flex-direction:column}
.shh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.shb{padding:14px 16px;overflow:auto}
.sha{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
.sha .btn{flex:1}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
label.f{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
.cloud{cursor:pointer;font-size:12px}
.cloud.pos{color:var(--ac)}.cloud.neg{color:var(--rd)}.cloud.warn{color:var(--am)}
input[type=text],input[type=password],input[type=date],input[type=number],select{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:var(--ac2)}
input.amt{font-size:30px;font-weight:700;padding:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:7px 13px;cursor:pointer;color:var(--mu)}
.chip.on{border-color:var(--ac);color:var(--tx);background:#18261f}
.chk{display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--tx)}
.chk input{width:18px;height:18px;accent-color:var(--ac2)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
details summary{cursor:pointer;color:var(--mu);font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#222;border:1px solid var(--bd);padding:9px 16px;border-radius:20px;z-index:30;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.hint{color:var(--mu);font-size:13px;margin:6px 2px 12px}
.empty{color:var(--mu);text-align:center;padding:26px 10px;font-size:14px}
.xs{background:none;border:0;color:var(--mu);cursor:pointer;padding:2px 6px}
.nav div{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:11.5px;padding-left:2px;padding-right:2px}
svg.ch{width:100%;max-width:560px;height:auto;display:block;margin:6px auto 0}
.ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ln.pos{stroke:var(--ac)}.ln.neg{stroke:var(--rd)}
.ar.pos{fill:var(--ac);opacity:.13}.ar.neg{fill:var(--rd);opacity:.2}
.zl{stroke:var(--mu);stroke-width:1;opacity:.55}
.pl{stroke:var(--am);stroke-width:1;stroke-dasharray:4 4;opacity:.85}
.tk{fill:var(--mu);font-size:10px}.tk.am{fill:var(--am)}.tk.rd{fill:var(--rd)}
.mk{fill:var(--bg);stroke:var(--am);stroke-width:2}.mk.rd{stroke:var(--rd)}
.cols{display:flex;gap:10px;align-items:flex-end;margin-top:10px}
.col{flex:1;min-width:0}
.bars{display:flex;gap:3px;align-items:flex-end}
.bb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mu);min-width:0}
.bb i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--ac2)}
.bb i.o{background:#5b6168}.bb i.r{background:#9b4f4f}
.cl{text-align:center;font-size:11.5px;color:var(--mu);margin-top:5px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.leg b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.wf{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.wf:last-child{border-bottom:0}
.wf .bar{grid-column:1/3;margin-top:4px;height:5px}
.wf.tot{font-weight:650}
.bar.am i{background:#a98a4c}
.bar.ng i{background:#9b4f4f}
.seg.sm{margin:0 0 6px}.seg.sm button{padding:6px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='mi_caja_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mkey=d=>String(d).slice(0,7);
const fmt=n=>(n<0?'-':'')+'$ '+Math.abs(Math.round(n)).toLocaleString('es-AR');
const fmtNum=n=>Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});
const parseAmt=s=>{s=String(s==null?'':s).trim();const neg=s.startsWith('-');const v=parseFloat(s.replace(/[^\d,]/g,'').replace(',','.'));return isNaN(v)?0:(neg?-v:v)};
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fdate=s=>toD(s).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
const mlabel=k=>{const[y,m]=k.split('-');return MONTHS[m-1]+' '+y};
function addMonth(k,n){let[y,m]=k.split('-').map(Number);const i=m-1+n;y+=Math.floor(i/12);return y+'-'+pad(((i%12)+12)%12+1)}
function dueIn(k,day){const[y,m]=k.split('-').map(Number);return k+'-'+pad(Math.min(day,new Date(y,m,0).getDate()))}

/* ---------- datos ---------- */
function seed(){return{v:1,setup:false,accounts:[{id:uid(),name:'Mercado Pago',open:0},{id:uid(),name:'Banco Galicia',open:0},{id:uid(),name:'Efectivo',open:0}],businesses:['Filo de Barrio','Parrilla','Personal'],movs:[],envelopes:[],debts:[],goals:[],plan:{items:[]},regla:{pct:30,piso:100000},last:{},lastBackup:null}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.accounts)S=seed();
S.last=S.last||{};
normalize(S);
let storageOk=true,localVer=0,conflictOpen=false,conflictSkip=false;
/* La configuración de sincronización vive aparte de los datos: nunca entra en los respaldos. */
const CKEY='mi_caja_sync_v1';
let cfg=null;try{cfg=JSON.parse(localStorage.getItem(CKEY))}catch(e){cfg=null}
const saveCfg=()=>{try{if(cfg)localStorage.setItem(CKEY,JSON.stringify(cfg));else localStorage.removeItem(CKEY)}catch(e){}};
/* mode 'auto' = fondos automáticos de sobres (se regeneran solos en cada dispositivo); 'sync' = viene de la nube. Ninguno cuenta como cambio pendiente. */
function save(mode){
  if(mode!=='auto'&&mode!=='sync'){
    S.updatedAt=new Date().toISOString();localVer++;
    if(cfg&&cfg.token&&cfg.auto!==false){cfg.dirty=true;saveCfg();schedSync(4000)}
  }
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOk=false}
}

/* ---------- cálculos ---------- */
const accName=id=>(S.accounts.find(a=>a.id===id)||{name:'?'}).name;
function accBal(a){let b=a.open||0;for(const m of S.movs){if(m.type==='in'&&m.acc===a.id)b+=m.amt;else if(m.type==='out'&&m.acc===a.id)b-=m.amt;else if(m.type==='tr'){if(m.acc===a.id)b-=m.amt;if(m.to===a.id)b+=m.amt}}return b}
const envPays=e=>S.movs.filter(m=>m.env===e.id);
function envBal(e){return e.fills.reduce((s,f)=>s+f.amount,0)-envPays(e).reduce((s,m)=>s+m.amt,0)}
function envInfo(e){
  const cm=mkey(today()),pays=envPays(e);
  const paidTotal=pays.reduce((s,m)=>s+m.amt,0);
  const paidMonth=pays.filter(m=>mkey(m.date)===cm).reduce((s,m)=>s+m.amt,0);
  const cuotas=(e.monthly>0?Math.floor(paidTotal/e.monthly+0.001):0)+(e.paid0||0);
  const done=!!(e.total&&cuotas>=e.total);
  const notStarted=!!(e.start&&cm<e.start);
  const paidOk=!notStarted&&e.monthly>0&&paidMonth>=e.monthly-0.01;
  let next=null,dueAmt=e.monthly;
  if(e.dueDay&&!done){
    if(!paidOk){next=dueIn(notStarted?e.start:cm,e.dueDay);dueAmt=notStarted?e.monthly:Math.max(0,e.monthly-paidMonth)}
    else{next=dueIn(addMonth(cm,1),e.dueDay);dueAmt=e.monthly;if(e.total&&cuotas>=e.total)next=null}
  }
  return{bal:envBal(e),paidMonth,paidOk,cuotas,done,next,dueAmt}
}
const debtRem=d=>d.total-d.pays.reduce((s,p)=>s+p.amount,0);
function ensureAuto(){
  let ch=false;const cur=mkey(today());
  for(const e of S.envelopes){
    if(!e.auto||!(e.monthly>0))continue;
    const skip=e.skip||[];let k=e.start||cur,g=0;
    while(k<=cur&&g++<240){
      if(e.total&&(e.fills.filter(f=>f.auto).length+skip.length+(e.paid0||0))>=e.total)break;
      if(!e.fills.some(f=>f.auto&&f.month===k)&&!skip.includes(k)){e.fills.push({id:uid(),date:k+'-01',amount:e.monthly,auto:true,month:k});ch=true}
      k=addMonth(k,1);
    }
  }
  if(ch)save('auto');
}
function removeMov(id){
  const m=S.movs.find(x=>x.id===id);if(!m)return;
  if(m.debt){const d=S.debts.find(x=>x.id===m.debt);if(d)d.pays=d.pays.filter(p=>p.movId!==id)}
  S.envelopes.forEach(e=>{e.fills=e.fills.filter(f=>f.mov!==id)});
  S.movs=S.movs.filter(x=>x.id!==id);
}

/* ---------- plan y proyección ---------- */
const dim=m=>{const[y,mm]=m.split('-').map(Number);return new Date(y,mm,0).getDate()};
const lastOf=m=>m+'-'+pad(dim(m));
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mshort=k=>{const[y,m]=k.split('-');return MONTHS[m-1].slice(0,3)+' '+y.slice(2)};
const short=n=>{const a=Math.abs(n),s=n<0?'-':'';if(a>=1e6)return s+(a/1e6).toFixed(2).replace('.',',').replace(/,?0+$/,'')+'M';if(a>=1e3)return s+Math.round(a/1e3)+'k';return s+Math.round(a)};
const envByRole=r=>S.envelopes.find(e=>e.role===r);
const ROLES=[['','Ninguno'],['puente','Puente (cubre meses en déficit)'],['b2','Barber 2 / inversión'],['fondo','Fondo de emergencia'],['margen','Margen personal']];
/* Reparto de un ingreso extra: 30% al margen y el resto por prioridad (Puente → Barber 2 → Fondo) hasta su meta. Una venta de algo propio va 100% a Barber 2. */
function splitExtra(amt,planned,tipo){
  const parts=[];
  if(tipo!=='extra'&&tipo!=='venta')return{ex:0,parts,rest:0};
  const ex=tipo==='venta'?amt:Math.max(0,amt-planned);
  if(!(ex>0))return{ex:0,parts,rest:0};
  let rest=ex;const used={};
  const bal=e=>Math.max(0,envBal(e))+(used[e.id]||0);
  const put=(e,a)=>{if(e&&a>0){parts.push({e,a});used[e.id]=(used[e.id]||0)+a;rest-=a}};
  if(tipo==='venta'){put(envByRole('b2'),rest);return{ex,parts,rest:Math.max(0,rest)}}
  const mg=envByRole('margen');if(mg)put(mg,Math.round(ex*(S.regla.pct/100)));
  for(const r of ['puente','b2','fondo']){const e=envByRole(r);if(!e||!(e.target>0))continue;put(e,Math.min(rest,Math.max(0,e.target-bal(e))))}
  return{ex,parts,rest:Math.max(0,rest)};
}
const planActive=(it,m)=>!it.off&&(it.date?mkey(it.date)===m:((!it.from||m>=it.from)&&(!it.until||m<=it.until)));
const planAmt=(it,m)=>{const v=it.byMonth&&it.byMonth[m];return v!=null?v:(it.amount||0)};
function spentCat(it,m){
  let s=(it.spent0&&it.spent0[m])||0;
  if(it.cat){const c=it.cat.toLowerCase();s+=S.movs.filter(x=>x.type==='out'&&mkey(x.date)===m&&(x.cat||'').toLowerCase()===c).reduce((a,x)=>a+x.amt,0)}
  return s;
}
/* Cuotas que le quedan a un sobre fijo, mes por mes, desde hoy. */
function envSchedule(e,endM){
  const i=envInfo(e);if(i.done||!(e.monthly>0)||!e.dueDay)return[];
  const cm=mkey(today());
  let left=e.total?Math.max(0,e.total-i.cuotas):1e9,k=(e.start&&cm<e.start)?e.start:cm;
  if(i.paidOk&&k===cm)k=addMonth(cm,1);
  const out=[];let g=0;
  while(left>0&&k<=endM&&g++<60){out.push({m:k,date:dueIn(k,e.dueDay),a:(k===cm&&!i.paidOk)?i.dueAmt:e.monthly});left--;k=addMonth(k,1)}
  return out;
}
/* Todos los movimientos esperados: plan + cuotas de sobres + deudas con fecha. */
function allEvents(n){
  const cm=mkey(today()),ev=[];n=n==null?4:n;
  for(let j=0;j<=n;j++){
    const m=addMonth(cm,j);
    S.plan.items.forEach(it=>{
      if(!planActive(it,m))return;
      const a=planAmt(it,m);if(!(a>0))return;
      const b={m,name:it.name,a,k:it.kind,est:!!it.est,noOp:!!it.noOp,deuda:it.kind==='out'&&!!it.deuda,it};
      if(it.spread)ev.push(Object.assign(b,{date:null,spread:true,rec:true}));
      else ev.push(Object.assign(b,{date:it.date||dueIn(m,it.day||1),rec:!it.date}));
    });
  }
  S.envelopes.forEach(e=>{if(e.kind==='fijo')envSchedule(e,addMonth(cm,n)).forEach(s=>ev.push({m:s.m,date:s.date,name:e.name,a:s.a,k:'out',deuda:!!e.total,rec:true,carry:true}))});
  S.debts.forEach(d=>{const r=debtRem(d);if(r>0&&d.due)ev.push({m:mkey(d.due),date:d.due,name:d.who,a:r,k:d.dir==='debo'?'out':'in',est:d.dir!=='debo',deuda:d.dir==='debo',rec:false,carry:true})});
  return ev;
}
/* Saldo total día por día durante 4 meses. opt.seg = ignorar ingresos estimados. */
function project(opt){
  opt=opt||{};const t=today(),cm=mkey(t),end=lastOf(addMonth(cm,3));
  const all=allEvents(4);
  const evs=all.filter(e=>!e.spread&&!(opt.seg&&e.k==='in'&&e.est)).map(e=>e.date<t?(e.carry?Object.assign({},e,{date:t}):null):e).filter(e=>e&&e.date<=end);
  const by={};evs.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const sp={};
  all.filter(e=>e.spread&&e.k==='out'&&e.m>=cm&&e.m<=addMonth(cm,3)).forEach(e=>{
    const n=dim(e.m);
    if(e.m===cm){const rem=Math.max(0,e.a-spentCat(e.it,cm)),d0=+t.slice(8),left=n-d0;if(left<=0||rem<=0)return;for(let d=d0+1;d<=n;d++){const k=cm+'-'+pad(d);sp[k]=(sp[k]||0)+rem/left}}
    else for(let d=1;d<=n;d++){const k=e.m+'-'+pad(d);sp[k]=(sp[k]||0)+e.a/n}
  });
  let bal=S.accounts.reduce((s,a)=>s+accBal(a),0);const start=bal;
  const days=[],mm={};let min=null;
  for(const d=toD(t);ymd(d)<=end;d.setDate(d.getDate()+1)){
    const k=ymd(d);bal-=sp[k]||0;
    (by[k]||[]).sort((a,b)=>(a.k==='out'?0:1)-(b.k==='out'?0:1)).forEach(e=>{bal+=e.k==='in'?e.a:-e.a;e.after=bal});
    days.push({date:k,bal});
    if(!min||bal<min.bal)min={bal,date:k};
    const m=k.slice(0,7);if(!mm[m]||bal<mm[m].bal)mm[m]={bal,date:k};
  }
  evs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.k==='out'?0:1)-(b.k==='out'?0:1));
  return{days,evs,min,mm,start};
}
/* De la caja de hoy a lo que realmente queda libre a fin de mes. */
function libreMes(){
  const P=project({seg:true}),cm=mkey(today()),last=lastOf(cm);
  const inn=P.evs.filter(e=>e.k==='in'&&e.date<=last).reduce((s,e)=>s+e.a,0);

  const dEnd=P.days.find(d=>d.date===last)||P.days[P.days.length-1];
  const vari=Math.max(0,P.start+inn-out-dEnd.bal);
  const ah=S.envelopes.filter(e=>e.kind==='ahorro');

  const falta=ah.filter(e=>(e.role==='puente'||e.role==='b2')&&e.target>0).reduce((s,e)=>s+Math.max(0,e.target-Math.max(0,envBal(e))),0);
  return{start:P.start,inn,out,vari,end:dEnd.bal,res,falta,libre:dEnd.bal-res-falta};

function estructura(){
  const cm=mkey(today()),all=allEvents(4),L=[];
  for(let j=1;j<=4;j++){
    const m=addMonth(cm,j),E=all.filter(e=>e.m===m),s=f=>E.filter(f).reduce((a,e)=>a+e.a,0);
    L.push({m,ri:s(e=>e.k==='in'&&e.rec&&!e.noOp),ro:s(e=>e.k==='out'&&e.rec),pi:s(e=>e.k==='in'&&(!e.rec||e.noOp)),po:s(e=>e.k==='out'&&!e.rec)});
  }

/* Cuánta deuda queda a fin de cada mes y cuándo llega a cero. */
function deudaMap(){
  const cm=mkey(today()),ev=allEvents(14).filter(e=>e.deuda&&e.k==='out');
  const tot=ev.reduce((s,e)=>s+e.a,0),by={};
  ev.forEach(e=>{by[e.m]=(by[e.m]||0)+e.a});
  const rows=[];let rem=tot;
  for(let j=0;j<=14;j++){const m=addMonth(cm,j),p=by[m]||0;rem-=p;rows.push({m,p,rem:Math.max(0,rem)});if(rem<=0.5)break}
  return{tot,rows,free:rem<=0.5?rows[rows.length-1].m:null};
}

let proMode='all';
function cols(items,max,h){
  return '<div class="cols">'+items.map(it=>'<div class="col"><div class="bars">'+it.bars.map(b=>'<div class="bb"><span>'+short(b.v)+'</span><i class="'+b.c+'" style="height:'+Math.max(2,Math.round(Math.abs(b.v)/max*h))+'px"></i></div>').join('')+'</div><div class="cl">'+it.label+'</div></div>').join('')+'</div>';
}
function lineChart(P){
  const W=360,H=190,L=6,R=6,T=16,B=20,n=P.days.length;
  const piso=S.regla.piso||0,vals=P.days.map(d=>d.bal);
  const lo=Math.min(0,...vals),hi=Math.max(piso*1.15,...vals,1),span=hi-lo||1;
  const x=i=>L+i*(W-L-R)/Math.max(1,n-1),y=v=>T+(hi-v)/span*(H-T-B);
  const y0=y(0),f=v=>v.toFixed(1);
  const line='M'+P.days.map((d,i)=>f(x(i))+','+f(y(d.bal))).join('L');
  const area=line+'L'+f(x(n-1))+','+f(y0)+'L'+f(x(0))+','+f(y0)+'Z';
  let s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saldo proyectado día por día"><defs><clipPath id="cu"><rect x="0" y="0" width="'+W+'" height="'+f(y0)+'"/></clipPath><clipPath id="cd"><rect x="0" y="'+f(y0)+'" width="'+W+'" height="'+f(Math.max(0,H-y0))+'"/></clipPath></defs>';
  s+='<path class="ar pos" d="'+area+'" clip-path="url(#cu)"/><path class="ar neg" d="'+area+'" clip-path="url(#cd)"/>';
  if(lo<0)s+='<line class="zl" x1="'+L+'" x2="'+(W-R)+'" y1="'+f(y0)+'" y2="'+f(y0)+'"/>';
  if(piso>0)s+='<line class="pl" x1="'+L+'" x2="'+(W-R)+'" y1="'+f(y(piso))+'" y2="'+f(y(piso))+'"/>';
  s+='<path class="ln pos" d="'+line+'" clip-path="url(#cu)"/><path class="ln neg" d="'+line+'" clip-path="url(#cd)"/>';
  P.days.forEach((d,i)=>{
    if(i===0)s+='<text class="tk" x="'+f(x(0))+'" y="'+(H-5)+'">hoy</text>';
    else if(d.date.endsWith('-01')&&i>6)s+='<text class="tk" x="'+f(x(i))+'" y="'+(H-5)+'">'+MONTHS[+d.date.slice(5,7)-1].slice(0,3)+'</text>';
  });
  const mi=P.days.findIndex(d=>d.date===P.min.date),mx=x(mi),my=y(P.min.bal),bad=P.min.bal<0;
  const anc=mx>W*0.65?'end':mx<W*0.35?'start':'middle',ly=my-9<T?my+16:my-9;
  s+='<circle class="mk '+(bad?'rd':'')+'" cx="'+f(mx)+'" cy="'+f(my)+'" r="4"/><text class="tk '+(bad?'rd':'am')+'" text-anchor="'+anc+'" x="'+f(mx)+'" y="'+f(ly)+'">'+esc(short(P.min.bal)+' · '+fdate(P.min.date))+'</text>';
  return s+'</svg>';
}

  h+='<div class="hint" style="margin-bottom:0">Solo cuenta ingresos seguros. “Libre real” es lo único que podés gastar o invertir después de cubrir deudas, tus sobres y lo que falta para que el Puente y Barber 2 lleguen a su meta. Si da negativo, es lo que todavía te falta juntar.</div></div>';
  const ES=estructura(),mxe=Math.max(...ES.map(e=>Math.max(e.ri,e.ro)),1);
  h+='<h2>Lo que se repite vs lo puntual</h2><div class="card">'+cols(ES.map(e=>({label:mshort(e.m),bars:[{v:e.ri,c:''},{v:e.ro,c:'o'}]})),mxe,110)+'<div class="leg"><span><b style="background:var(--ac2)"></b>ingresos que se repiten</span><span><b style="background:#5b6168"></b>gastos y cuotas</span></div><div style="margin-top:8px">';
  ES.forEach(e=>{const r=e.ri-e.ro,p=e.pi-e.po;h+='<div class="row"><div class="l"><b style="text-transform:capitalize">'+mlabel(e.m)+'</b><span>puntuales: '+(p>=0?'+':'−')+fmt(Math.abs(p))+'</span></div><div class="r"><span class="'+(r<0?'neg':'pos')+'">'+fmt(r)+'</span><div class="mu" style="font-size:11.5px;font-weight:400">sin puntuales</div></div></div>'});
  h+='</div><div class="hint" style="margin-bottom:0">Si el resultado sin puntuales es negativo, ese mes lo cubren ingresos que no se repiten (aguinaldo, extras) o tus reservas.</div></div>';

function planSheet(){
  const sub=it=>{
    let s=it.spread?fmt(it.amount||0)+'/mes repartido':it.date?fmt(it.amount||0)+' · '+fdate(it.date):fmt(it.amount||0)+' · día '+it.day;
    if(it.est)s+=' · <span class="warn">estimado</span>';
    if(it.noOp)s+=' · cobro de círculo';
    if(it.deuda)s+=' · cuota';
    if(it.tope)s+=' · tope';
    return s+(it.note?'<span style="display:block">'+esc(it.note)+'</span>':'');
  };
  const row=it=>'<div class="row"><div class="l click" data-pe="'+it.id+'" style="cursor:pointer;opacity:'+(it.off?.45:1)+'"><b>'+esc(it.name)+'</b><span>'+sub(it)+'</span></div><button class="chip '+(it.off?'':'on')+'" data-pt="'+it.id+'">'+(it.off?'Apagado':'Activo')+'</button></div>';
  const draw=()=>{
    const I=S.plan.items,sec=(t,L)=>L.length?'<h2 style="margin-top:14px">'+t+'</h2><div>'+L.map(row).join('')+'</div>':'';
    return '<div class="hint" style="margin-top:0">Esto es lo que esperás que pase en los próximos meses. Alimenta el saldo proyectado. Los que dicen “apagado” no cuentan: sirven para comparar escenarios (por ejemplo, pagar Barber 2 todo junto o con las sillas en cuotas).</div>'+
      sec('Ingresos',I.filter(x=>x.kind==='in'))+sec('Gastos y cuotas',I.filter(x=>x.kind==='out'&&!x.date))+sec('Puntuales',I.filter(x=>x.kind==='out'&&x.date))+
      (I.length?'':'<div class="empty">Todavía no hay nada. Agregá tu sueldo y tus gastos fijos.</div>')+
      '<div class="acts"><button class="btn p" data-pn>+ Agregar ítem</button></div>';
  };
  sheet('Plan de ingresos y gastos',draw(),[{label:'Cerrar',fn:()=>{}}],body=>{
    const wire=()=>{
      body.querySelectorAll('[data-pe]').forEach(el=>el.onclick=()=>{closeSheet();setTimeout(()=>planForm(S.plan.items.find(x=>x.id===el.dataset.pe)),0)});
      body.querySelectorAll('[data-pt]').forEach(el=>el.onclick=()=>{
        const it=S.plan.items.find(x=>x.id===el.dataset.pt);if(!it)return;
        const turnOn=!!it.off;
        if(it.grp){
          if(turnOn){S.plan.items.forEach(x=>{if(x.grp===it.grp)x.off=(x.opt!==it.opt)})}
          else S.plan.items.forEach(x=>{if(x.grp===it.grp&&x.opt===it.opt)x.off=true});
        }else it.off=!it.off;
        save();redraw();render();
      });
      const pn=body.querySelector('[data-pn]');if(pn)pn.onclick=()=>{closeSheet();setTimeout(()=>planForm(),0)};
    };
    const redraw=()=>{body.innerHTML=draw();wire()};wire();
  });
}
function importPlan(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d.plan||!Array.isArray(d.plan.items)||!Array.isArray(d.envelopes))throw 0;
      if(!confirm('Esto reemplaza tus sobres, deudas, objetivos y el plan por los del archivo ('+d.envelopes.length+' sobres, '+(d.debts||[]).length+' deudas, '+d.plan.items.length+' ítems de plan). Tus cuentas y movimientos NO se tocan. ¿Seguir?'))return;
      S.movs.forEach(m=>{delete m.env;delete m.debt});
      S.plan=d.plan;S.envelopes=d.envelopes;S.debts=d.debts||[];S.goals=d.goals||[];
      if(d.regla)S.regla=Object.assign({pct:30,piso:100000},d.regla);
      (d.businesses||[]).forEach(b=>{if(!S.businesses.includes(b))S.businesses.push(b)});
      S.setup=true;normalize(S);save();closeSheet();render();toast('Plan cargado');
    }catch(e){toast('Ese archivo no es un plan válido')}};r.readAsText(f)};
  i.click();
}

    h+='<input type="password" autocomplete="off" data-s="token" value="'+esc(D.sync.token)+'" placeholder="Token de GitHub" style="margin-top:8px">';
    h+='<input type="password" autocomplete="off" data-s="pass" value="'+esc(D.sync.pass)+'" placeholder="Contraseña de cifrado (recomendada)" style="margin-top:8px">';
    h+='<div class="acts"><button class="btn sm p" data-conn>'+(cfg?'Guardar y sincronizar':'Conectar')+'</button>'+(cfg?'<button class="btn sm" data-syncnow>Sincronizar ahora</button><button class="btn sm d" data-disc>Desconectar</button>':'')+'</div>';
    h+='<details><summary>Cómo conseguir el token y la contraseña</summary><div class="hint"><b>Token:</b> GitHub → Settings → Developer settings → Personal access tokens → <i>Fine-grained</i> → Generate. Elegí <i>Only select repositories</i> (solo el repo de datos), y en Permissions → Repository permissions poné <i>Contents: Read and write</i>.<br><b>Contraseña:</b> inventá una larga y guardala en un lugar seguro. Se escribe una vez en cada dispositivo. Si la perdés no hay forma de recuperar lo cifrado en la nube (tu copia local sigue funcionando). Debe ser <b>la misma</b> en todos tus dispositivos.</div></details>';
    h+='<label class="f">Respaldo</label><div class="acts" style="margin-top:0"><button class="btn sm" data-exp>⬇ Exportar respaldo</button><button class="btn sm" data-imp>⬆ Importar respaldo</button></div><div class="hint">Guardá el archivo en tu nube (Drive, OneDrive, etc.) o en el pendrive. Para pasar tus datos a otro dispositivo: exportás acá e importás allá.'+(S.lastBackup?' Último respaldo: '+fdate(S.lastBackup)+'.':'')+'</div>';
    h+='<label class="f">Zona de riesgo</label><button class="btn sm d" data-reset>Borrar todos los datos</button>';
    return h;
  };
  sheet(first?'Configuración inicial':'Ajustes',draw(),[{label:'Guardar',cls:'p',fn:()=>{
    if(D.accs.some(a=>!a.name.trim())){toast('Todas las cuentas necesitan nombre');return false}
    S.accounts=D.accs.map(a=>({id:a.id,name:a.name.trim(),open:parseAmt(a.open)}));
    S.businesses=D.biz.length?D.biz:['Personal'];
    S.regla={pct:Math.max(0,Math.min(100,parseFloat(D.r.pct)||0)),piso:parseAmt(D.r.piso)};
    S.setup=true;save();render();toast('Guardado');
  }}],body=>{
    const wire=()=>{
      body.querySelectorAll('[data-p]').forEach(el=>el.oninput=()=>{if(el.classList.contains('money'))fmtMoney(el);D.accs[el.dataset.i][el.dataset.p]=el.value});
      body.querySelector('[data-nb]').oninput=e=>D.nb=e.target.value;
      body.querySelector('[data-add]').onclick=()=>{D.accs.push({id:uid(),name:'',open:''});redraw()};
      body.querySelector('[data-addbiz]').onclick=()=>{const v=D.nb.trim();if(v&&!D.biz.includes(v))D.biz.push(v);D.nb='';redraw()};
      body.querySelectorAll('[data-delbiz]').forEach(el=>el.onclick=()=>{D.biz.splice(+el.dataset.delbiz,1);redraw()});
      body.querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{D.sync[el.dataset.s]=el.value});
      body.querySelectorAll('[data-r]').forEach(el=>el.oninput=()=>{if(el.classList.contains('money'))fmtMoney(el);D.r[el.dataset.r]=el.value});
      body.querySelector('[data-planopen]').onclick=()=>{closeSheet();setTimeout(planSheet,0)};
      body.querySelector('[data-impplan]').onclick=importPlan;
      body.querySelector('[data-conn]').onclick=()=>connectSync(D.sync);
      const sn=body.querySelector('[data-syncnow]');if(sn)sn.onclick=()=>syncNow(true);
      const dc=body.querySelector('[data-disc]');
      if(dc)dc.onclick=()=>{if(!confirm('¿Desconectar la sincronización? Tus datos siguen en este dispositivo y en el repo.'))return;cfg=null;saveCfg();D.sync={owner:'',repo:'',token:'',pass:''};redraw();render()};
      body.querySelector('[data-exp]').onclick=exportBackup;
      body.querySelector('[data-imp]').onclick=importBackup;
      body.querySelector('[data-reset]').onclick=()=>{if(confirm('¿Borrar TODOS los datos? Esto no se puede deshacer.')&&confirm('Última confirmación: se pierde todo lo que no hayas respaldado.')){S=seed();save();closeSheet();render();settings(true)}};
    };
    const redraw=()=>{body.innerHTML=draw();wire()};wire();
  });
}

/* ---------- sincronización con GitHub ---------- */
let syncing=false,syncAgain=false,syncTimer=null,syncErr='',retry409=0;
const hhmm=iso=>new Date(iso).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
function schedSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),ms)}
function cloudState(){
  if(!cfg||!cfg.token)return{t:'sin sincronizar',c:''};
  if(syncErr)return{t:'error de sync',c:'neg'};
  if(syncing)return{t:'sincronizando…',c:''};
  if(cfg.dirty)return{t:'pendiente',c:'warn'};
  return{t:'sincronizado'+(cfg.last?' '+hhmm(cfg.last):''),c:'pos'};
}
function syncText(){
  if(!cfg)return'';
  if(syncErr)return'Error: '+syncErr;
  if(syncing)return'Sincronizando…';
  if(cfg.dirty)return'Hay cambios sin subir. Se suben solos en unos segundos.';
  return cfg.last?'Sincronizado a las '+hhmm(cfg.last)+'. Cada cambio se sube solo.':'Conectado.';
}
function paint(){render();const el=document.querySelector('[data-syncstat]');if(el)el.textContent=syncText()}
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptStr(text,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await deriveKey(pass,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text)));
  return JSON.stringify({caja:1,enc:'aes-gcm',salt:b64e(salt),iv:b64e(iv),data:b64e(ct)});
}
async function decryptStr(o,pass){
  const k=await deriveKey(pass,b64d(o.salt));
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.data)));
}
const gh=(c,path,opt)=>{opt=opt||{};return fetch('https://api.github.com'+path,Object.assign({},opt,{headers:Object.assign({Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})}))};
async function chk(res){
  if(res.ok)return;
  const m={401:'Token inválido o vencido',403:'El token no tiene permiso (o se pasó el límite de GitHub)',404:'No encuentro el repo o el archivo: revisá usuario, nombre del repo y los permisos del token'}[res.status]||('GitHub respondió '+res.status);
  throw new Error(m);
}
const localIsEmpty=()=>!S.movs.length&&!S.envelopes.length&&!S.debts.length&&!S.goals.length&&S.accounts.every(a=>!a.open);
function normalize(o){o.last=o.last||{};o.goals=o.goals||[];o.debts=o.debts||[];o.envelopes=o.envelopes||[];o.businesses=o.businesses&&o.businesses.length?o.businesses:['Personal'];o.plan=o.plan&&Array.isArray(o.plan.items)?o.plan:{items:[]};o.regla=Object.assign({pct:30,piso:100000},o.regla||{});return o}
const fileUrl=()=>'/repos/'+cfg.owner+'/'+cfg.repo+'/contents/'+encodeURI(cfg.path||'data.json');
async function ghRead(){
  const res=await gh(cfg,fileUrl(),{cache:'no-store'});
  if(res.status===404)return null;
  await chk(res);
  const j=await res.json();
  return{sha:j.sha,data:async()=>{
    let c=j.content;
    if(!c){const b=await gh(cfg,'/repos/'+cfg.owner+'/'+cfg.repo+'/git/blobs/'+j.sha);await chk(b);c=(await b.json()).content}
    let o=JSON.parse(new TextDecoder().decode(b64d(c.replace(/\s/g,''))));
    if(o&&o.enc){
      if(!cfg.pass)throw new Error('Los datos de la nube están cifrados: falta la contraseña de cifrado');
      try{o=JSON.parse(await decryptStr(o,cfg.pass))}catch(e){throw new Error('Contraseña de cifrado incorrecta')}
    }
    if(!o||!o.accounts||!o.movs)throw new Error('El archivo de la nube no es válido');
    return normalize(o);
  }};
}
async function ghWrite(sha){
  const ver=localVer;
  const text=cfg.pass?await encryptStr(JSON.stringify(S),cfg.pass):JSON.stringify(S);
  const body={message:'Mi Caja '+new Date().toISOString(),content:b64e(new TextEncoder().encode(text))};
  if(sha)body.sha=sha;
  const res=await gh(cfg,fileUrl(),{method:'PUT',body:JSON.stringify(body)});
  if(res.status===409||res.status===422)return'retry';
  await chk(res);
  const j=await res.json();
  cfg.sha=j.content.sha;cfg.last=new Date().toISOString();
  if(ver===localVer)cfg.dirty=false;else syncAgain=true;
  saveCfg();return'ok';
}
async function pushOrRetry(sha){
  const x=await ghWrite(sha);
  if(x==='retry'){if(retry409++<2)syncAgain=true;else{retry409=0;throw new Error('No pude subir: la nube cambió mientras guardaba. Probá de nuevo.')}}
  else retry409=0;
}
function adopt(r,R){
  try{localStorage.setItem('mi_caja_prev',JSON.stringify(S))}catch(e){}
  S=R;S.setup=true;cfg.sha=r.sha;cfg.dirty=false;cfg.last=new Date().toISOString();saveCfg();save('sync');
  viewMonth=mkey(today());render();toast('Datos actualizados desde la nube');
}
async function forcePush(sha){
  syncing=true;paint();
  try{let x=await ghWrite(sha);if(x==='retry'){const r2=await ghRead();x=await ghWrite(r2?r2.sha:null)}if(x==='ok')toast('Nube actualizada')}
  catch(e){syncErr=e instanceof TypeError?'Sin conexión con GitHub':e.message}
  finally{syncing=false;paint()}
}
async function showConflict(r){
  if(conflictOpen)return;
  let R;try{R=await r.data()}catch(e){syncErr=e.message;return}
  conflictOpen=true;
  const f=o=>o.movs.length+' movimientos'+(o.updatedAt?' · modificado '+new Date(o.updatedAt).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'');
  sheet('Datos distintos en la nube','<div class="alert a">Hay cambios en este dispositivo y también en la nube. Elegí cuál conservar.</div><div class="card"><b>Este dispositivo</b><div class="mu">'+f(S)+'</div></div><div class="card"><b>Nube (GitHub)</b><div class="mu">'+f(R)+'</div></div><div class="hint">La opción que no elijas se pisa. Si querés comparar antes, tocá “Después”, exportá un respaldo desde ⚙ y volvé.</div>',[
    {label:'Usar la nube',fn:()=>{conflictOpen=false;conflictSkip=false;adopt(r,R)}},
    {label:'Usar este dispositivo',cls:'p',fn:()=>{conflictOpen=false;conflictSkip=false;forcePush(r.sha)}},
    {label:'Después',fn:()=>{}}
  ]);
}
async function syncNow(manual){
  if(!cfg||!cfg.token)return;
  if(syncing){syncAgain=true;return}
  if(typeof navigator!=='undefined'&&navigator.onLine===false){syncErr='';paint();return}
  syncing=true;syncErr='';paint();
  try{
    const r=await ghRead();
    if(!r){if(!localIsEmpty())await pushOrRetry(null)}
    else if(r.sha===cfg.sha){if(cfg.dirty)await pushOrRetry(r.sha)}
    else if(!cfg.dirty||localIsEmpty()){
      if($('#ov').classList.contains('on')&&!manual)schedSync(8000);
      else adopt(r,await r.data());
    }
    else if(conflictSkip&&!manual){}
    else await showConflict(r);
  }catch(e){syncErr=e instanceof TypeError?'Sin conexión con GitHub':e.message}
  finally{syncing=false;paint();if(syncAgain){syncAgain=false;schedSync(1500)}}
}
async function connectSync(d){
  const n={owner:(d.owner||'').trim(),repo:(d.repo||'').trim(),token:(d.token||'').trim(),pass:d.pass||'',auto:true,path:'data.json',sha:null,dirty:!localIsEmpty(),last:null};
  if(!n.owner||!n.repo||!n.token){toast('Completá usuario, repo y token');return}
  if(n.pass&&!(typeof crypto!=='undefined'&&crypto.subtle)){toast('Este navegador no permite cifrar desde este archivo. Usá la app desde su link https o dejá la contraseña vacía');return}
  if(!n.pass&&!confirm('Sin contraseña de cifrado tus datos quedan legibles dentro del repo privado. ¿Conectar igual?'))return;
  toast('Verificando…');
  try{
    const res=await gh(n,'/repos/'+n.owner+'/'+n.repo);
    if(res.status===401){toast('Token inválido o vencido');return}
    if(res.status===404){toast('No encuentro ese repo, o el token no tiene acceso a él');return}
    await chk(res);
    const info=await res.json();
    if(info.private===false){alert('Ese repositorio es PÚBLICO: cualquiera podría ver tus datos. Creá uno privado y probá de nuevo.');return}
  }catch(e){toast(e instanceof TypeError?'Sin conexión con GitHub':e.message);return}
  if(cfg&&cfg.owner===n.owner&&cfg.repo===n.repo){n.sha=cfg.sha;n.last=cfg.last;n.dirty=cfg.dirty||(cfg.pass||'')!==n.pass}
  cfg=n;saveCfg();conflictSkip=false;closeSheet();
  await syncNow(true);
  toast(syncErr?syncErr:'Sincronización conectada');
}

/* ---------- acciones ---------- */
const A={
  tab:d=>{tab=d.v;render();scrollTo(0,0)},
  sub:d=>{sub=d.v;render()},
  month:d=>{viewMonth=addMonth(viewMonth,+d.d);render()},
  add:()=>movForm(),
  editMov:d=>movForm(S.movs.find(m=>m.id===d.id)),
  settings:()=>settings(false),
  newEnv:()=>envForm(),
  editEnv:d=>envForm(S.envelopes.find(e=>e.id===d.id)),
  fillEnv:d=>fillForm(S.envelopes.find(e=>e.id===d.id)),
  payEnv:d=>payEnvForm(S.envelopes.find(e=>e.id===d.id)),
  delFill:d=>{const e=S.envelopes.find(x=>x.id===d.env),f=e.fills.find(x=>x.id===d.id);if(!confirm('¿Quitar este apartado?'))return;if(f.auto){e.skip=e.skip||[];e.skip.push(f.month)}e.fills=e.fills.filter(x=>x.id!==d.id);save();render()},
  delPay:d=>{if(!confirm('¿Eliminar este pago? También se quita de Movimientos.'))return;removeMov(d.id);save();render()},
  newDebt:()=>debtForm(),
  editDebt:d=>debtForm(S.debts.find(x=>x.id===d.id)),
  payDebt:d=>payDebtForm(S.debts.find(x=>x.id===d.id)),
  delDebtPay:d=>{if(!confirm('¿Quitar este pago?'))return;const x=S.debts.find(y=>y.id===d.d),p=x.pays.find(y=>y.id===d.id);if(p&&p.movId)S.movs=S.movs.filter(m=>m.id!==p.movId);x.pays=x.pays.filter(y=>y.id!==d.id);save();render()},
  proMode:d=>{proMode=d.v;render()},
  planOpen:()=>planSheet(),
  newGoal:()=>goalForm(),
  editGoal:d=>goalForm(S.goals.find(x=>x.id===d.id))
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.closest('#ov'))return;const f=A[t.dataset.act];if(f)f(t.dataset)});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(cfg&&cfg.token&&cfg.dirty)syncNow();return}
  if(!$('#ov').classList.contains('on'))render();
  if(cfg&&cfg.token)syncNow();
});
window.addEventListener('online',()=>{if(cfg&&cfg.token)syncNow()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
if(!S.setup)settings(true);
if(cfg&&cfg.token)syncNow();
</script>
